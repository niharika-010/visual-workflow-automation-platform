<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Top Header Navigation -->
  <rect x="0" y="0" width="1200" height="64" fill="#090d16" border-bottom="1px solid #1e293b" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#1e293b" stroke-width="1.5" />

  <!-- Logo -->
  <rect x="24" y="14" width="36" height="36" rx="10" fill="url(#tealGrad)" />
  <path d="M 34 26 L 50 26 M 42 26 L 42 38" stroke="#080c14" stroke-width="3" stroke-linecap="round" />
  <text x="72" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="18">WorkflowAutomator</text>
  <rect x="240" y="22" width="70" height="20" rx="10" fill="#0d9488" fill-opacity="0.2" stroke="#0d9488" stroke-opacity="0.4" />
  <text x="250" y="35" fill="#5eead4" font-family="system-ui, sans-serif" font-weight="700" font-size="10">ENTERPRISE</text>

  <!-- Profile & Active Badge -->
  <rect x="1000" y="18" width="90" height="28" rx="14" fill="#0f172a" stroke="#1e293b" />
  <circle cx="1014" cy="32" r="4" fill="#10b981" />
  <text x="1026" y="36" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Active API</text>

  <circle cx="1130" cy="32" r="16" fill="#0d9488" fill-opacity="0.3" stroke="#0d9488" stroke-opacity="0.5" />
  <text x="1125" y="37" fill="#5eead4" font-family="system-ui, sans-serif" font-weight="800" font-size="13">A</text>

  <!-- Sidebar -->
  <rect x="0" y="64" width="220" height="611" fill="#090d16" />
  <line x1="220" y1="64" x2="220" y2="675" stroke="#1e293b" stroke-width="1.5" />

  <!-- Sidebar Items -->
  <rect x="16" y="88" width="188" height="40" rx="10" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-opacity="0.3" />
  <text x="32" y="113" fill="#5eead4" font-family="system-ui, sans-serif" font-weight="700" font-size="13">⚡ Workflows</text>

  <text x="32" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="13">📈 Execution Runs</text>
  <text x="32" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="13">⚙️ Settings & Credentials</text>

  <!-- Main Content Dashboard -->
  <text x="252" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="22">Workflows Workspace</text>
  <text x="252" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Design, trigger, and automate backend workflows with visual DAG graphs.</text>

  <!-- Action Button -->
  <rect x="1010" y="88" width="150" height="38" rx="10" fill="#0d9488" filter="url(#shadow)" />
  <text x="1035" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="13">+ Create Workflow</text>

  <!-- Metrics Overview Cards -->
  <g transform="translate(252, 150)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="85" rx="14" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <text x="20" y="30" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="11">TOTAL WORKFLOWS</text>
    <text x="20" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="26">12</text>

    <!-- Card 2 -->
    <rect x="300" y="0" width="280" height="85" rx="14" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <text x="320" y="30" fill="#2dd4bf" font-family="system-ui, sans-serif" font-weight="700" font-size="11">ACTIVE WORKFLOWS</text>
    <text x="320" y="65" fill="#2dd4bf" font-family="system-ui, sans-serif" font-weight="900" font-size="26">8</text>

    <!-- Card 3 -->
    <rect x="600" y="0" width="308" height="85" rx="14" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <text x="620" y="30" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="700" font-size="11">DRAFT WORKFLOWS</text>
    <text x="620" y="65" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="900" font-size="26">4</text>
  </g>

  <!-- Workflows Grid Cards -->
  <g transform="translate(252, 260)">
    <!-- Workflow Card 1 -->
    <rect x="0" y="0" width="280" height="170" rx="16" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#0d9488" fill-opacity="0.2" stroke="#0d9488" stroke-opacity="0.4" />
    <text x="26" y="37" fill="#5eead4" font-size="14">⚡</text>
    <text x="60" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Customer Onboarding</text>
    <text x="60" y="46" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Webhook → IF → Email → Slack</text>
    
    <rect x="200" y="16" width="64" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
    <text x="214" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-weight="800" font-size="10">ACTIVE</text>

    <line x1="16" y1="110" x2="264" y2="110" stroke="#1e293b" />
    <text x="16" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">4 Nodes • Updated 2m ago</text>
    
    <rect x="180" y="125" width="84" height="30" rx="8" fill="#0d9488" />
    <text x="194" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Open Builder</text>

    <!-- Workflow Card 2 -->
    <rect x="300" y="0" width="280" height="170" rx="16" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <rect x="316" y="16" width="32" height="32" rx="8" fill="#0d9488" fill-opacity="0.2" stroke="#0d9488" stroke-opacity="0.4" />
    <text x="326" y="37" fill="#5eead4" font-size="14">⚡</text>
    <text x="360" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Order Sync Pipeline</text>
    <text x="360" y="46" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Schedule → HTTP → Postgres</text>

    <rect x="500" y="16" width="64" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
    <text x="514" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-weight="800" font-size="10">ACTIVE</text>

    <line x1="316" y1="110" x2="564" y2="110" stroke="#1e293b" />
    <text x="316" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">3 Nodes • Updated 15m ago</text>

    <rect x="480" y="125" width="84" height="30" rx="8" fill="#0d9488" />
    <text x="494" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Open Builder</text>

    <!-- Workflow Card 3 -->
    <rect x="600" y="0" width="308" height="170" rx="16" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <rect x="616" y="16" width="32" height="32" rx="8" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.3" />
    <text x="626" y="37" fill="#fbbf24" font-size="14">📝</text>
    <text x="660" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Lead Nurture Flow</text>
    <text x="660" y="46" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Webhook → Code → Postgres</text>

    <rect x="830" y="16" width="60" height="20" rx="10" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-opacity="0.4" />
    <text x="846" y="30" fill="#fcd34d" font-family="system-ui, sans-serif" font-weight="800" font-size="10">DRAFT</text>

    <line x1="616" y1="110" x2="892" y2="110" stroke="#1e293b" />
    <text x="616" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">3 Nodes • Updated 1h ago</text>

    <rect x="808" y="125" width="84" height="30" rx="8" fill="#0d9488" />
    <text x="822" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Open Builder</text>
  </g>
</svg>
