<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Top Header Navigation -->
  <rect x="0" y="0" width="1200" height="64" fill="#090d16" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#1e293b" stroke-width="1.5" />

  <text x="24" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="18">WorkflowAutomator</text>

  <!-- Sidebar -->
  <rect x="0" y="64" width="220" height="611" fill="#090d16" />
  <line x1="220" y1="64" x2="220" y2="675" stroke="#1e293b" stroke-width="1.5" />

  <text x="32" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="13">⚡ Workflows</text>
  <text x="32" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="13">📈 Execution Runs</text>

  <rect x="16" y="190" width="188" height="40" rx="10" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-opacity="0.3" />
  <text x="32" y="215" fill="#5eead4" font-family="system-ui, sans-serif" font-weight="700" font-size="13">⚙️ Settings & Credentials</text>

  <!-- Settings Page Title -->
  <text x="252" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="22">System & Credential Settings</text>
  <text x="252" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Manage secure integration credentials and monitor backend architecture health.</text>

  <!-- Tab Switcher -->
  <rect x="1000" y="90" width="160" height="36" rx="10" fill="#090d16" stroke="#1e293b" />
  <rect x="1004" y="94" width="76" height="28" rx="8" fill="#0d9488" />
  <text x="1018" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Credentials</text>
  <text x="1090" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Health</text>

  <!-- Credentials Section Header -->
  <text x="252" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">🔑 Secure Credential Store</text>
  <text x="252" y="196" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Secrets are isolated and referenced by credential ID in canvas JSON.</text>

  <rect x="1020" y="165" width="140" height="34" rx="8" fill="#0d9488" />
  <text x="1040" y="187" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">+ Add Credential</text>

  <!-- Credential Card 1 -->
  <g transform="translate(252, 220)">
    <rect x="0" y="0" width="280" height="130" rx="14" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#0d9488" fill-opacity="0.2" stroke="#0d9488" stroke-opacity="0.4" />
    <text x="26" y="37" fill="#5eead4" font-size="14">🛡️</text>

    <text x="60" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="13">Prod Slack Webhook</text>
    <text x="60" y="46" fill="#5eead4" font-family="monospace" font-weight="700" font-size="10">SLACK_WEBHOOK</text>

    <line x1="16" y1="85" x2="264" y2="85" stroke="#1e293b" />
    <text x="16" y="106" fill="#64748b" font-family="monospace" font-size="10">ID: 3a4376af-162d-44ec-813c</text>
  </g>

  <!-- Credential Card 2 -->
  <g transform="translate(552, 220)">
    <rect x="0" y="0" width="280" height="130" rx="14" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#0d9488" fill-opacity="0.2" stroke="#0d9488" stroke-opacity="0.4" />
    <text x="26" y="37" fill="#5eead4" font-size="14">📧</text>

    <text x="60" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="13">SMTP Email Provider</text>
    <text x="60" y="46" fill="#5eead4" font-family="monospace" font-weight="700" font-size="10">SMTP_EMAIL</text>

    <line x1="16" y1="85" x2="264" y2="85" stroke="#1e293b" />
    <text x="16" y="106" fill="#64748b" font-family="monospace" font-size="10">ID: b42290cb-b7dc-49d0-9717</text>
  </g>

  <!-- Credential Card 3 -->
  <g transform="translate(852, 220)">
    <rect x="0" y="0" width="308" height="130" rx="14" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#0d9488" fill-opacity="0.2" stroke="#0d9488" stroke-opacity="0.4" />
    <text x="26" y="37" fill="#5eead4" font-size="14">🐘</text>

    <text x="60" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="13">Analytics PostgreSQL DB</text>
    <text x="60" y="46" fill="#5eead4" font-family="monospace" font-weight="700" font-size="10">POSTGRES_DB</text>

    <line x1="16" y1="85" x2="292" y2="85" stroke="#1e293b" />
    <text x="16" y="106" fill="#64748b" font-family="monospace" font-size="10">ID: 7ac5886c-8b5c-4fda-951f</text>
  </g>

  <!-- System Health Section Header -->
  <text x="252" y="390" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">🖥️ Infrastructure Health Status</text>

  <!-- Health Card 1: Express REST API -->
  <g transform="translate(252, 415)">
    <rect x="0" y="0" width="280" height="95" rx="14" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <text x="20" y="30" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Express REST API</text>
    <circle cx="250" cy="25" r="5" fill="#10b981" />
    <text x="20" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Online</text>
    <text x="20" y="82" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Port 5000 • Uptime 1420s</text>
  </g>

  <!-- Health Card 2: PostgreSQL Database -->
  <g transform="translate(552, 415)">
    <rect x="0" y="0" width="280" height="95" rx="14" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <text x="20" y="30" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="700" font-size="12">PostgreSQL Database</text>
    <circle cx="250" cy="25" r="5" fill="#10b981" />
    <text x="20" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Connected</text>
    <text x="20" y="82" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Port 5432 • JSONB &amp; OS-UUID</text>
  </g>

  <!-- Health Card 3: Redis & BullMQ Queue -->
  <g transform="translate(852, 415)">
    <rect x="0" y="0" width="308" height="95" rx="14" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />
    <text x="20" y="30" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Redis &amp; BullMQ Queue</text>
    <circle cx="278" cy="25" r="5" fill="#10b981" />
    <text x="20" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Connected</text>
    <text x="20" y="82" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Port 6379 • Queue workflow-execution-queue</text>
  </g>
</svg>
