<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Top Header Navigation -->
  <rect x="0" y="0" width="1200" height="64" fill="#090d16" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#1e293b" stroke-width="1.5" />

  <text x="24" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="18">WorkflowAutomator</text>

  <!-- Sidebar -->
  <rect x="0" y="64" width="220" height="611" fill="#090d16" />
  <line x1="220" y1="64" x2="220" y2="675" stroke="#1e293b" stroke-width="1.5" />

  <text x="32" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="13">⚡ Workflows</text>
  
  <rect x="16" y="140" width="188" height="40" rx="10" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-opacity="0.3" />
  <text x="32" y="165" fill="#5eead4" font-family="system-ui, sans-serif" font-weight="700" font-size="13">📈 Execution Runs</text>

  <text x="32" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="13">⚙️ Settings & Credentials</text>

  <!-- Main Content Executions Dashboard -->
  <text x="252" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="22">Execution Runs Monitoring</text>
  <text x="252" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Monitor real-time workflow executions, step logs, and duration metrics.</text>

  <!-- Table Container Card -->
  <rect x="252" y="160" width="910" height="470" rx="16" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)" />

  <!-- Table Header -->
  <rect x="252" y="160" width="910" height="48" rx="16" fill="#090d16" />
  <text x="280" y="190" fill="#64748b" font-family="system-ui, sans-serif" font-weight="800" font-size="11">STATUS</text>
  <text x="400" y="190" fill="#64748b" font-family="system-ui, sans-serif" font-weight="800" font-size="11">WORKFLOW NAME</text>
  <text x="640" y="190" fill="#64748b" font-family="system-ui, sans-serif" font-weight="800" font-size="11">EXECUTION ID</text>
  <text x="860" y="190" fill="#64748b" font-family="system-ui, sans-serif" font-weight="800" font-size="11">STARTED AT</text>
  <text x="1060" y="190" fill="#64748b" font-family="system-ui, sans-serif" font-weight="800" font-size="11">DURATION</text>

  <!-- Row 1: Success -->
  <g transform="translate(252, 208)">
    <line x1="0" y1="0" x2="910" y2="0" stroke="#1e293b" />
    <rect x="28" y="14" width="76" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
    <text x="42" y="29" fill="#34d399" font-family="system-ui, sans-serif" font-weight="800" font-size="10">✓ SUCCESS</text>

    <text x="148" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Customer Onboarding Webhook</text>
    <text x="388" y="30" fill="#94a3b8" font-family="monospace" font-size="11">5971af31-37fa-4f68-b910</text>
    <text x="608" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">12:40:14 PM</text>
    <text x="808" y="30" fill="#2dd4bf" font-family="monospace" font-size="12">120ms</text>
  </g>

  <!-- Row 2: Success -->
  <g transform="translate(252, 260)">
    <line x1="0" y1="0" x2="910" y2="0" stroke="#1e293b" />
    <rect x="28" y="14" width="76" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
    <text x="42" y="29" fill="#34d399" font-family="system-ui, sans-serif" font-weight="800" font-size="10">✓ SUCCESS</text>

    <text x="148" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Order Sync Pipeline</text>
    <text x="388" y="30" fill="#94a3b8" font-family="monospace" font-size="11">0e1fe993-1b2b-41da-ac2c</text>
    <text x="608" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">12:38:22 PM</text>
    <text x="808" y="30" fill="#2dd4bf" font-family="monospace" font-size="12">450ms</text>
  </g>

  <!-- Row 3: Running -->
  <g transform="translate(252, 312)">
    <line x1="0" y1="0" x2="910" y2="0" stroke="#1e293b" />
    <rect x="28" y="14" width="76" height="22" rx="11" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.4" />
    <text x="42" y="29" fill="#60a5fa" font-family="system-ui, sans-serif" font-weight="800" font-size="10">⚡ RUNNING</text>

    <text x="148" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Lead Nurture Flow</text>
    <text x="388" y="30" fill="#94a3b8" font-family="monospace" font-size="11">7dc13fc3-ee67-4d9a-825b</text>
    <text x="608" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">12:35:01 PM</text>
    <text x="808" y="30" fill="#38bdf8" font-family="monospace" font-size="12">In progress...</text>
  </g>

  <!-- Row 4: Failed -->
  <g transform="translate(252, 364)">
    <line x1="0" y1="0" x2="910" y2="0" stroke="#1e293b" />
    <rect x="28" y="14" width="76" height="22" rx="11" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-opacity="0.4" />
    <text x="42" y="29" fill="#fb7185" font-family="system-ui, sans-serif" font-weight="800" font-size="10">❌ FAILED</text>

    <text x="148" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Payment Ingestion Webhook</text>
    <text x="388" y="30" fill="#94a3b8" font-family="monospace" font-size="11">d9433cc8-ce39-4585-9612</text>
    <text x="608" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">12:20:10 PM</text>
    <text x="808" y="30" fill="#fb7185" font-family="monospace" font-size="12">1.25s</text>
  </g>
</svg>
