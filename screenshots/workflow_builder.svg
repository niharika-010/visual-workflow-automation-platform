<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1e293b" />
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Top Header Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#090d16" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#1e293b" stroke-width="1.5" />

  <text x="24" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">← Workspace</text>
  <rect x="130" y="14" width="36" height="36" rx="10" fill="url(#tealGrad)" />
  <path d="M 140 26 L 156 26 M 148 26 L 148 38" stroke="#080c14" stroke-width="3" stroke-linecap="round" />
  
  <text x="178" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="16">Customer Onboarding Webhook</text>
  <rect x="420" y="20" width="90" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
  <text x="432" y="35" fill="#34d399" font-family="system-ui, sans-serif" font-weight="800" font-size="10">SAVED (v3)</text>

  <!-- Header Right Actions -->
  <rect x="900" y="16" width="80" height="32" rx="8" fill="#0f172a" stroke="#1e293b" />
  <text x="918" y="37" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Versions</text>

  <rect x="990" y="16" width="70" height="32" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
  <text x="1006" y="37" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Active</text>

  <rect x="1070" y="16" width="100" height="32" rx="8" fill="#0d9488" filter="url(#shadow)" />
  <text x="1105" y="37" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">Save</text>

  <!-- Canvas Dot Grid Background -->
  <rect x="220" y="64" width="680" height="611" fill="url(#dotGrid)" />

  <!-- Left Sidebar Node Library Panel -->
  <rect x="0" y="64" width="220" height="611" fill="#090d16" />
  <line x1="220" y1="64" x2="220" y2="675" stroke="#1e293b" stroke-width="1.5" />
  <text x="16" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="800" font-size="11">NODE CATALOG</text>

  <!-- Node Catalog List -->
  <rect x="12" y="110" width="196" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
  <text x="24" y="136" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">🌐 Webhook Trigger</text>

  <rect x="12" y="160" width="196" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
  <text x="24" y="186" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12">🔀 IF Condition</text>

  <rect x="12" y="210" width="196" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
  <text x="24" y="236" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12">📧 Send Email</text>

  <rect x="12" y="260" width="196" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
  <text x="24" y="286" fill="#ec4899" font-family="system-ui, sans-serif" font-size="12">💬 Slack Notification</text>

  <rect x="12" y="310" width="196" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
  <text x="24" y="336" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="12">🐘 PostgreSQL Query</text>

  <!-- CANVAS REACT FLOW NODES & EDGES -->
  <!-- Connections (SVG Paths) -->
  <path d="M 370 200 C 420 200, 430 200, 480 200" fill="none" stroke="#0d9488" stroke-width="3" />
  <path d="M 640 185 C 690 185, 690 140, 720 140" fill="none" stroke="#10b981" stroke-width="3" />
  <path d="M 640 215 C 690 215, 690 270, 720 270" fill="none" stroke="#f43f5e" stroke-width="3" />

  <!-- Node 1: Webhook -->
  <g transform="translate(250, 160)">
    <rect x="0" y="0" width="120" height="80" rx="14" fill="#0f172a" stroke="#0d9488" stroke-width="2" filter="url(#shadow)" />
    <text x="12" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">Webhook</text>
    <text x="12" y="48" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">POST /api/orders</text>
    <circle cx="120" cy="40" r="5" fill="#0d9488" />
  </g>

  <!-- Node 2: IF Condition -->
  <g transform="translate(480, 150)">
    <rect x="0" y="0" width="160" height="100" rx="14" fill="#0f172a" stroke="#0d9488" stroke-width="2" filter="url(#shadow)" />
    <text x="14" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">IF Condition</text>
    <text x="14" y="46" fill="#a855f7" font-family="system-ui, sans-serif" font-size="10">amount &gt; 100</text>

    <circle cx="0" cy="50" r="5" fill="#0d9488" />
    <circle cx="160" cy="35" r="5" fill="#10b981" />
    <text x="135" y="39" fill="#34d399" font-family="system-ui, sans-serif" font-weight="800" font-size="9">TRUE</text>
    <circle cx="160" cy="65" r="5" fill="#f43f5e" />
    <text x="130" y="69" fill="#fb7185" font-family="system-ui, sans-serif" font-weight="800" font-size="9">FALSE</text>
  </g>

  <!-- Node 3: Send Email (TRUE branch) -->
  <g transform="translate(720, 100)">
    <rect x="0" y="0" width="130" height="75" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
    <text x="12" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">Send Email</text>
    <text x="12" y="46" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">VIP Alert Email</text>
    <circle cx="0" cy="38" r="5" fill="#10b981" />
  </g>

  <!-- Node 4: Slack Notification (FALSE branch) -->
  <g transform="translate(720, 230)">
    <rect x="0" y="0" width="130" height="75" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)" />
    <text x="12" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">Slack Alert</text>
    <text x="12" y="46" fill="#ec4899" font-family="system-ui, sans-serif" font-size="10">#sales-channel</text>
    <circle cx="0" cy="38" r="5" fill="#f43f5e" />
  </g>

  <!-- Right Inspector Panel -->
  <rect x="900" y="64" width="300" height="611" fill="#090d16" />
  <line x1="900" y1="64" x2="900" y2="675" stroke="#1e293b" stroke-width="1.5" />

  <text x="920" y="96" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">IF Condition Inspector</text>
  <text x="920" y="114" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Configure node branch logic</text>

  <rect x="920" y="140" width="260" height="36" rx="8" fill="#0f172a" stroke="#1e293b" />
  <text x="932" y="163" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Field: body.amount</text>

  <rect x="920" y="190" width="260" height="36" rx="8" fill="#0f172a" stroke="#1e293b" />
  <text x="932" y="213" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Operator: greater_than (&gt;)</text>

  <rect x="920" y="240" width="260" height="36" rx="8" fill="#0f172a" stroke="#1e293b" />
  <text x="932" y="263" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Value: 100</text>
</svg>
